<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Cart</title>
<style>
:root { --bg:#f3f4f8; --card:#fff; --text:#1f2430; --muted:#6b7280; --line:#e8eaf0; --brand:#4f46e5; --brand2:#7c3aed; --danger:#e11d48; --soft:#eef0ff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0f1117; --card:#181b24; --text:#e8eaf0; --muted:#9aa1b2; --line:#262a36; --brand:#6366f1; --brand2:#8b5cf6; --soft:#23263a; }
}
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
header { background: linear-gradient(135deg, var(--brand), var(--brand2)); color:#fff; border-radius:16px; padding:22px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; box-shadow:0 8px 24px rgba(79,70,229,.25); }
header h1 { margin:0; font-size:1.5rem; }
header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
.badge { background:rgba(255,255,255,.2); padding:8px 14px; border-radius:999px; font-weight:600; white-space:nowrap; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#34d399; margin-right:6px; animation:pulse 2s infinite; }
.dot.off { background:#fca5a5; animation:none; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.grid { display:grid; grid-template-columns: 1fr 300px; gap:16px; margin-top:16px; align-items:start; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
.card h2 { margin:0 0 14px; font-size:1.05rem; }
.fields { display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px; }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
label { display:block; font-size:.8rem; color:var(--muted); font-weight:600; }
input { width:100%; margin-top:6px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:1rem; background:var(--card); color:var(--text); }
input:focus { outline:2px solid var(--brand); border-color:transparent; }
button { font-family:inherit; cursor:pointer; }
.primary { margin-top:14px; width:100%; padding:12px; border:0; border-radius:10px; background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; font-size:1rem; font-weight:600; }
.primary:hover { filter:brightness(1.08); }
.chips { margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:.8rem; color:var(--muted); }
.chip { border:1px solid var(--line); background:var(--soft); color:var(--text); padding:6px 12px; border-radius:999px; font-size:.85rem; }
.chip:hover { border-color:var(--brand); }
ul { list-style:none; margin:0; padding:0; }
.row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:0; }
.av { width:42px; height:42px; border-radius:12px; background:var(--soft); color:var(--brand); display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
.info { flex:1; min-width:0; }
.nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sub { color:var(--muted); font-size:.85rem; margin-top:2px; }
.lt { font-weight:600; }
.rm { border:0; background:transparent; color:var(--muted); width:32px; height:32px; border-radius:8px; font-size:1rem; }
.rm:hover { background:rgba(225,29,72,.12); color:var(--danger); }
.empty { text-align:center; color:var(--muted); padding:28px 0 12px; }
.empty .big { font-size:2.4rem; }
.sum-row { display:flex; justify-content:space-between; padding:6px 0; color:var(--muted); }
.sum-total { display:flex; justify-content:space-between; align-items:baseline; padding-top:12px; margin-top:8px; border-top:1px dashed var(--line); font-weight:700; font-size:1.25rem; color:var(--text); }
.ghost { margin-top:14px; width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--danger); font-weight:600; }
.ghost:disabled { opacity:.4; cursor:default; }
.toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); background:#111827; color:#fff; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:.25s; font-size:.9rem; }
.toast.show { opacity:1; transform:translate(-50%, 0); }
.toast.bad { background:var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>&#128722; Shopping Cart</h1>
      <p><span class="dot" id="dot"></span><span id="liveTxt">Live - updates when an AI agent uses the MCP tools</span></p>
    </div>
    <div class="badge" id="count">0 items</div>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Add a product</h2>
        <form id="f">
          <div class="fields">
            <label>Product name<input name="name" placeholder="e.g. Running shoes" maxlength="80" required></label>
            <label>Price (&#8377;)<input name="price" type="number" step="0.01" min="0.01" placeholder="0.00" required></label>
            <label>Quantity<input name="qty" type="number" min="1" value="1" required></label>
          </div>
          <button class="primary" type="submit">Add to cart</button>
        </form>
        <div class="chips">
          <span>Quick add:</span>
          <button class="chip" data-n="Shoes" data-p="999">Shoes &#8377;999</button>
          <button class="chip" data-n="Bag" data-p="400">Bag &#8377;400</button>
          <button class="chip" data-n="Watch" data-p="2499">Watch &#8377;2499</button>
          <button class="chip" data-n="Headphones" data-p="1499">Headphones &#8377;1499</button>
        </div>
      </div>

      <div class="card">
        <h2>Your cart</h2>
        <ul id="list"></ul>
        <div class="empty" id="empty" hidden>
          <div class="big">&#128717;</div>
          <div>Your cart is empty. Add something above!</div>
        </div>
      </div>
    </div>

    <aside class="card">
      <h2>Order summary</h2>
      <div class="sum-row"><span>Items</span><span id="sumItems">0</span></div>
      <div class="sum-total"><span>Total</span><span id="sumTotal">&#8377;0.00</span></div>
      <button class="ghost" id="clearBtn" disabled>Clear cart</button>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const RS = '\u20B9';
const $ = (id) => document.getElementById(id);
const money = (n) => RS + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let lastSig = '';
let current = [];

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = 'toast'; }, 2200);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function render(data) {
  current = data.items;
  const sig = JSON.stringify(data);
  if (sig === lastSig) return;
  lastSig = sig;
  const list = $('list');
  list.replaceChildren();
  let count = 0;
  for (const it of data.items) {
    count += it.qty;
    const li = document.createElement('li');
    li.className = 'row';
    const av = document.createElement('div');
    av.className = 'av';
    av.textContent = (it.name[0] || '?').toUpperCase();
    const info = document.createElement('div');
    info.className = 'info';
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = it.name;
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = it.qty + ' x ' + money(it.price);
    info.append(nm, sub);
    const lt = document.createElement('div');
    lt.className = 'lt';
    lt.textContent = money(it.price * it.qty);
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.title = 'Remove';
    rm.setAttribute('aria-label', 'Remove ' + it.name);
    rm.innerHTML = '&#10005;';
    rm.onclick = async () => {
      try { await api('/api/cart/' + it.id, { method: 'DELETE' }); toast('Removed ' + it.name); }
      catch (e) { toast('Could not remove item', true); }
      load();
    };
    li.append(av, info, lt, rm);
    list.appendChild(li);
  }
  $('empty').hidden = data.items.length > 0;
  $('count').textContent = count + (count === 1 ? ' item' : ' items');
  $('sumItems').textContent = count;
  $('sumTotal').textContent = money(data.total);
  $('clearBtn').disabled = data.items.length === 0;
}

async function load() {
  try {
    render(await api('/api/cart'));
    $('dot').className = 'dot';
  } catch (e) {
    $('dot').className = 'dot off';
  }
}

async function add(name, price, qty) {
  try {
    await api('/api/cart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, price: price, qty: qty })
    });
    toast('Added ' + name);
  } catch (e) {
    toast('Could not add item', true);
  }
  load();
}

$('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  add(String(fd.get('name')).trim(), parseFloat(fd.get('price')), parseInt(fd.get('qty'), 10));
  e.target.reset();
  e.target.qty.value = 1;
});

document.querySelectorAll('.chip').forEach((b) => {
  b.addEventListener('click', () => add(b.dataset.n, parseFloat(b.dataset.p), 1));
});

$('clearBtn').addEventListener('click', async () => {
  try {
    await Promise.all(current.map((it) => api('/api/cart/' + it.id, { method: 'DELETE' })));
    toast('Cart cleared');
  } catch (e) {
    toast('Could not clear cart', true);
  }
  load();
});

load();
setInterval(load, 3000);
</script>
</body>
</html>
